services:
  # =========================================================================
  # 1. PostgreSQL Veritabanı
  # =========================================================================
  # Smart Bakery analitik verileri (smartbakery_db) ve Superset metadata (superset)
  # bu servis üzerinde barındırılır.
  postgres:
    image: postgres:15-alpine
    container_name: smartbakery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbakery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbakery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbakery_network

  # =========================================================================
  # 2. Redis Önbellek Servisi
  # =========================================================================
  # Superset'in sorgu sonuçlarını ve oturum bilgilerini önbelleğe alması için kullanılır.
  redis:
    image: redis:7-alpine
    container_name: smartbakery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbakery_network

  # =========================================================================
  # 3. Apache Superset Başlatma ve Migrasyon (Init) Servisi
  # =========================================================================
  # Superset ilk çalıştığında veritabanı şemasını günceller, admin kullanıcısını
  # (admin / admin) oluşturur ve varsayılan rolleri/izinleri yapılandırır.
  superset-init:
    image: smartbakery-superset:latest
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: smartbakery_superset_init
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "smart_bakery_secret_key_superset_2024!"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:postgres@postgres:5432/superset"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    entrypoint: >
      /bin/sh -c "
      echo 'Superset veritabani semasi guncelleniyor (db upgrade)...';
      superset db upgrade;
      echo 'Superset admin kullanicisi olusturuluyor...';
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@smartbakery.com --password admin || true;
      echo 'Superset roller ve izinler yukleniyor (superset init)...';
      superset init;
      echo 'Superset basariyla hazirlandi!';
      "
    networks:
      - smartbakery_network

  # =========================================================================
  # 4. Apache Superset Web Uygulaması
  # =========================================================================
  # Dashboard ve veri görselleştirme web arayüzünü sunar.
  # superset-init tamamlandıktan sonra otomatik olarak ayağa kalkar.
  superset:
    image: smartbakery-superset:latest
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: smartbakery_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: "smart_bakery_secret_key_superset_2024!"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:postgres@postgres:5432/superset"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      TALISMAN_ENABLED: "False"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartbakery_network

volumes:
  postgres_data:
    name: smartbakery_postgres_data
  redis_data:
    name: smartbakery_redis_data
  superset_home:
    name: smartbakery_superset_home

networks:
  smartbakery_network:
    name: smartbakery_network

